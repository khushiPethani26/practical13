<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>STUDENT REG FORM</h1>

    <form id="studentForm" onsubmit="return validateMyform()">

        Enrollment Number: <br>
        <input type="text" id="enrollment">
        <br><br>

        Name: <br>
        <input type="text" id="name">
        <br><br>

        Email ID: <br>
        <input type="email" id="email">
        <br><br>

        Password: <br>
        <input type="password" id="password">
        <br><br>
        Confirm Password: <br>
        <input type="password" id="confirmPassword">
        <br><br>

        Phone Number: <br>
        <input type="text" id="phone">
        <br><br>

        Address: <br>
        <textarea id="address" rows="3" cols="30"></textarea>
        <br><br>

        Gender: <br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Branch: <br>
        <select id="branch">
            <option value="">--Select Branch--</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="IT Engineering">IT Engineering</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">

    </form>


    <script>

        function validateMyform() {

            let enrollment = document.getElementById("enrollment").value.trim();
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let phone = document.getElementById("phone").value.trim();
            let address = document.getElementById("address").value.trim();
            let gender = document.querySelector('input[name="gender"]:checked');
            let branch = document.getElementById("branch").value;

            if (
                enrollment === "" ||
                name === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === "" ||
                phone === "" ||
                address === "" ||
                !gender ||
                branch === ""
            ) {
                alert("Please fill out all details.");
                return false;
            }

            let enrollmentPattern = /^[0-9]{2}[A-Z]{2}[0-9]{6}$/;

            if (!enrollment.match(enrollmentPattern)) {
                alert("Invalid Enrollment Number.\nExample: 23CE123456");
                return false;
            }

            let namePattern = /^[A-Za-z ]+$/;

            if (!name.match(namePattern)) {
                alert("Name should contain only alphabets.");
                return false;
            }

            if (name.length < 3) {
                alert("Name must contain at least 3 characters.");
                return false;
            }

            let emailPattern =
                /^[a-z]+[.][a-z]+[0-9]{6}@marwadiuniversity[.]ac[.]in$/;

            if (!email.match(emailPattern)) {
                alert("Invalid email address.\nExample: abc.def123456@marwadiuniversity.ac.in");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long!");
                return false;
            }

            let upperCase = /[A-Z]/;

            if (!password.match(upperCase)) {
                alert("Password must contain at least one uppercase letter.");
                return false;
            }

            let lowerCase = /[a-z]/;

            if (!password.match(lowerCase)) {
                alert("Password must contain at least one lowercase letter.");
                return false;
            }

            let number = /[0-9]/;

            if (!password.match(number)) {
                alert("Password must contain at least one number.");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Password and Confirm Password do not match.");
                return false;
            }

            let phonePattern = /^[0-9]{10}$/;

            if (!phone.match(phonePattern)) {
                alert("Invalid phone number.\nPhone number must contain exactly 10 digits.");
                return false;
            }

            let mobilePattern = /^[6-9][0-9]{9}$/;

            if (!phone.match(mobilePattern)) {
                alert("Phone number must start with 6, 7, 8 or 9.");
                return false;
            }

            if (address.length < 10) {
                alert("Address must contain at least 10 characters.");
                return false;
            }

            alert("Form Submitted Successfully!");

            return true;
        }

    </script>

</body>

</html>
